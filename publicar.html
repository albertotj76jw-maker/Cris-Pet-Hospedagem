    <div class="publicar-wrapper">

        <div class="publicar-card">

            <h1 class="text-center fw-bold mb-4">
                <i class="bi bi-megaphone-fill"></i>
                Publicar SOS Pet
            </h1>

            <p class="text-center mb-4">
                Publique rapidamente informações sobre pets desaparecidos.
            </p>

            <form action="php/publicar_pet.php" method="POST" enctype="multipart/form-data">

                <div class="row g-3">

                    <div class="col-md-6">
                        <input type="text" name="nome_pet" placeholder="Nome do Pet" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <input type="text" name="raca" placeholder="Raça" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <input type="text" name="cidade" placeholder="Cidade" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <input type="text" name="telefone" placeholder="Telefone" class="form-control">
                    </div>

                    <div class="col-12">
                        <textarea name="descricao" rows="5" class="form-control"
                            placeholder="Descreva o pet desaparecido"></textarea>
                    </div>

                    <div class="col-12">
                        <input type="file" name="imagem" class="form-control">
                    </div>

                    <div class="col-12">
                        <button class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-send-fill"></i>
                            Publicar SOS
                        </button>
                    </div>

                </div>

            </form>

        </div>

    </div>
